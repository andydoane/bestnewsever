<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#333333">
    <title>Best News Ever!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app" class="app" aria-live="polite"></main>

    <div id="overlayControls" class="overlay-controls is-hidden" aria-label="Page controls">
        <button id="fullscreenButton" class="overlay-icon-button" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
        <button id="adminButton" class="overlay-icon-button" type="button" title="Settings" aria-label="Open settings">⚙</button>
    </div>

    <button id="restartButton" class="restart-button is-hidden" type="button" title="Start again" aria-label="Start again">↻</button>

    <dialog id="adminDialog" class="admin-dialog">
        <div class="admin-panel">
            <div class="admin-heading-row">
                <div>
                    <h2>Activity Settings</h2>
                    <p id="adminSummary" class="admin-summary"></p>
                </div>
                <button id="closeAdminButton" class="admin-close-button" type="button" aria-label="Close settings">✕</button>
            </div>

            <p class="admin-help">Check any activities that have already been completed, then save. Once Wild Card Mode begins, it stays on until you start a new cycle.</p>

            <div id="adminActivityList" class="admin-activity-list"></div>

            <div class="admin-actions">
                <button id="saveAdminButton" type="button" class="primary-button">Save completed activities</button>
                <button id="undoLastButton" type="button" class="secondary-button">Undo last completed activity</button>
                <button id="resetCycleButton" type="button" class="warning-button">Start a new 24-activity cycle</button>
                <button id="clearAllButton" type="button" class="danger-button">Clear all app data</button>
            </div>

            <div class="history-block">
                <h3>Recent history</h3>
                <div id="historyList" class="history-list"></div>
            </div>
        </div>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
